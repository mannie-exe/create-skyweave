schema: 1
records:
  - id: flight/building-weights
    title: Building materials affect ship mass
    inputs: []
    outputs: []
    evidence: native-mass-and-assembly-checks
    detail: "Skyweave: Resource Patches extends Sable's existing weight tiers to partial construction, windows, furniture, fixtures and equivalent machine variants. DnD recolored flywheels match Create at 4.0; the complete gigantic cogwheel remains 9.0 across nine physical positions. Weight belongs to placed colliding blocks, not inventory item count. Cargo, lift, volume and copied-material rules remain unchanged. The Atlas exports the tags but does not calculate assembled-ship mass."
    sources:
      - resource-patches/data/sable/tags/block
      - docs/development/weights.md
  - id: contraptions/radio
    title: Radio movement-handler compatibility
    inputs: [[analogaudio:radio]]
    outputs: []
    evidence: isolated-registration-and-server-callbacks
    detail: "Skyweave: Compatibility Patches restores Analog Audio's existing movement-handler registration for Analog Audio 0.1.5-hotfix.1 with Create 6.0.10. Recipes, controls and Sable audio behavior are unchanged. Registration and server callbacks were verified; audible playback and GUI behavior on ordinary moving contraptions still need playtesting."
    sources:
      - docs/development/compatibility.md
      - https://github.com/mannie-exe/skyweave-compat/blob/main/docs/development/README.md#analog-audio
  - id: travel/glider
    title: Glide and climb local updrafts
    inputs: [[reliable_gliders:glider]]
    outputs: []
    evidence: implementation
    detail: Hold the glider; durability drains during use. Default updraft height 15, strength 0.7; repair and updraft block tags are editable. Flight range needs measured launch altitude and descent rate.
    sources:
      ['https://github.com/evanbones/Reliable-Gliders', 'reliable_gliders.json']
  - id: travel/rope
    title: Establish a short crossing
    inputs: []
    outputs: []
    evidence: implementation
    detail: Throwable connector ranges are 10 blocks by hand, 20 with launcher, 40 mounted; Simulated ropes max 40. Plunger range 64, with backtank air supported. These are nearby crossing tools, not universal long-range bridges.
    sources:
      [
        'throwable rope connector config',
        'simulated-server.toml',
        'climbable_ropes-server.toml',
      ]
  - id: logistics/docking
    title: Dock and transfer cargo
    inputs: []
    outputs: []
    evidence: implementation
    detail: Simulated docking connectors transfer items and fluids between inventories/tanks; matching pose and physical access matter. Includes comparator progress. A moving industrial base can have a purpose beyond passenger transport.
    sources: ['Simulated bundled Ponder translations', 'simulated-server.toml']
  - id: logistics/delivery
    title: Village delivery contracts
    inputs: []
    outputs: []
    evidence: implementation
    detail: Quest board creates physical schematic cargo and route compasses. Village mode targets structure positions, not a simulated village economy or NPC demand. Four offers and a 120-minute deadline. Search offsets are 500 to 2000 blocks, but ADQ 1.1.1 does not enforce that maximum after locating a structure; actual routes can be longer. Damaged cargo reduces payout. The optional Compat adapters retain endpoint chunks, use horizontal route-distance checks and retry unsafe Sky Village locate points within their bounds. A native offer was generated; completed cargo delivery remains unverified.
    sources:
      [
        'https://modrinth.com/mod/aeronautics-delivery-quests',
        'aeronautics_delivery_quests.toml',
      ]
  - id: propulsion/solid
    title: Solid-fuel thrust
    inputs: [[createpropulsion:solid_fuel_thruster]]
    outputs: []
    evidence: implementation
    detail: Present in released 1.1.5, with a copper/iron-sheet, andesite-alloy, chute and pipe recipe. Potential early propulsion role; preserve distinct endurance/control tradeoffs before changing recipes.
    sources:
      [
        'createpropulsion:crafting/solid_fuel_thruster',
        'createpropulsion-common.toml',
      ]
  - id: propulsion/liquid
    title: Turpentine supplies liquid thrusters
    inputs: [[createpropulsion:thruster]]
    outputs: []
    evidence: implementation
    detail: 'Turpentine needs unheated basin mixing of pine resin and water. A single standard thruster consumes a base 1 mB/tick multiplied by the fuel burn rate: 150% for turpentine, 100% for lava. A 1000 mB tank therefore lasts about 33.3 seconds on turpentine or 50 seconds on lava at full throttle and 20 TPS, without multiblock or oxidizer modifiers. Turpentine provides 100% thrust versus lava at 75%; these are fuel budgets, not flight-range measurements.'
    sources:
      [
        'createpropulsion:thruster_fuels/turpentine.json',
        'createpropulsion-common.toml',
      ]
  - id: power/ion
    title: Electrical propulsion and persistent power infrastructure
    inputs: [[createpropulsion:ion_thruster]]
    outputs: []
    evidence: implementation
    detail: Default 40 FE/tick at full throttle and 4000 FE internal buffer give five seconds at 20 TPS without supply. Power Grid and docking can make charging infrastructure meaningful; actual ship power transfer needs flight testing.
    sources: ['createpropulsion-common.toml', 'simulated-server.toml']
  - id: power/flywheel-storage
    title: Flywheel Bearing storage is disabled
    inputs: [[bits_n_bobs:flywheel_bearing]]
    outputs: []
    evidence: configuration
    detail: The block is available and its recipe requires a Brass Casing, but flywheelBearingStorageCapability is false. It currently provides no kinetic-storage route. A proposed persistent role is burst power or engine-off operation; enable and test storage before claiming that role.
    sources: ['bits_n_bobs-common.toml', 'bits_n_bobs-server.toml']
  - id: linkage/pneumatic-motion
    title: Configurable pneumatic motion
    inputs:
      [
        [aeronautics_utility_objects:hydraulic_connection_head],
        [aeronautics_utility_objects:hydraulic_rod],
      ]
    outputs: []
    evidence: native-actuation-and-client-checks
    detail: Connect heads on separate assembled bodies, then right-click the rod body for target, return-force and damping controls. A powered regulator separately maps redstone to target length. The stock actuation contract is retained; these controls are not a supplied fluid network. No inventory-producing recipe is implied.
    sources:
      [
        'docs/development/progression.md',
        'https://github.com/mannie-exe/skyweave-compat/blob/main/docs/development/transmission-linkage.md',
      ]
  - id: linkage/physical-conversion
    title: Physical rotation recovery
    inputs: [[aeronautics_utility_objects:damping_stress_bearing]]
    outputs: []
    evidence: controlled-native-conversion
    detail: The assembled bearing measures physical rotation and publishes rear shaft output while resisting the motion. A controlled 2-rad/s fixture produced 19 RPM and about 3711 SU with native defaults. This is a supplied test drive, not a demonstrated self-powered machine or a sustained production budget.
    sources:
      [
        'https://github.com/mannie-exe/skyweave-compat/blob/main/docs/development/verification.md',
      ]
  - id: controls/link-frequencies
    title: Edit link frequencies
    inputs: [[create:redstone_link]]
    outputs: []
    evidence: native-packet-and-client-checks
    detail: Empty hand + Shift + right-click on a frequency slot opens Link GUI. Ghost selections and personal presets do not consume items. Compat validates menus and server permissions; relocation is limited to ordinary links within one world or ship, up to 24 blocks. Vector-thruster frequency menus remain available without machinery relocation.
    sources: ['docs/development/compatibility.md#redstone-control']
