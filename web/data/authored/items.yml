schema: 1
notes:
  reliable_gliders:glider:
    text: The released recipe requires two phantom membranes, three leather and three sticks. Early travel route through phantom encounters after several sleepless nights, or other membrane sources. The journal includes membrane and glider inventory checks. Recipe and membrane repairs remain unchanged.
    status: progression-review
    sources: ['reliable_gliders:glider', 'minecraft:entities/phantom']
  createpropulsion:platinum_nugget:
    text: Existing pregen need not be discarded to obtain platinum. The active crushed-gold washing recipe adds one platinum nugget at 5% chance. New platinum ore is a separate new-chunk source; no retro-generation was performed.
    status: verified-alternate-route
    sources: ['create:splashing/crushed_raw_gold', 'runtime/recipes.json']
  powergrid:zinc_sheet:
    text: Unified to createdeco:zinc_sheet for new production. Existing Power Grid sheets remain registered and accepted by shared tag ingredients. The duplicate pressing recipe is removed by Almost Unified.
    status: verified-unification
    sources: ['runtime item tags', 'overrides/common/config/almostunified']
  bits_n_bobs:flywheel_bearing:
    text: Do not gate a disposable intermediate tier around this. Flywheel storage is currently disabled in Bits 'n' Bobs; evaluate useful buffering against persistent batteries after mapping demand.
    status: decision-pending
    sources: ['bits_n_bobs-server.toml', 'create_connected-server.toml']
  create_factory:spread_bucket:
    text: The upstream spread recipe requires Ecologics walnuts and is disabled because Ecologics is absent. The registered bucket and fluid remain visible. This is optional integration content, not a missing core progression ingredient.
    status: optional-integration-disabled
    sources: ['create_factory:recipe/spread.json', 'runtime registered recipes']
  interiors:seatwood_planks:
    text: No producing route is indexed for this item. It appears in many generic seat recipes, while wood-specific alternatives produce the corresponding furniture. Keep it flagged for source review; its high use count does not prove that all those furniture items are blocked.
    status: source-review
    sources: ['runtime/recipes.json', 'runtime/items.json']
  hostile_skies:captains_orders:
    text: Automatic raids are disabled in this pack. Captain orders therefore lack a normal enabled spawn route; manual administrator-triggered raids remain available for testing. This is an intentional setting constraint, not a reason to enable random player-targeted raids.
    status: intentional-access-limit
    sources: ['hostile_skies-common.toml', 'data/authored/mobs.yml']
  absolute_kinematics:hinge:
    text: Driven 180-degree joint with a separate through shaft. The native recipe uses a wooden slab, gearbox and industrial iron block. The Workshop journal checks acquisition; assembly, 16-RPM side drive, its stop and recovery were checked separately in a native fixture.
    status: runtime-checked
    sources:
      [
        'absolute_kinematics:hinge',
        'docs/development/progression.md',
        'Absolute Kinematics 1.0.1 native fixture',
      ]
  absolute_kinematics:ball_joint:
    text: Passive joint with shaft passthrough and configurable redstone locking. The native recipe uses a wooden slab, brass ingot and industrial iron block. It adds articulation rather than a powered linear actuator. Native assembly, redstone lock/release and recovery passed; complete articulated aircraft remain untested.
    status: runtime-checked
    sources:
      [
        'absolute_kinematics:ball_joint',
        'docs/development/progression.md',
        'Absolute Kinematics 1.0.1 native fixture',
      ]
  aeronautics_utility_objects:hydraulic_rod:
    text: Configurable link between assembled physics structures. Normal actuation uses target length and return force without an external supply; a shaft-powered regulator separately automates the target. Right-click the rod body for settings; sneak-use a Create wrench to detach it. Equipment acquisition does not establish a working mechanism.
    status: runtime-checked
    sources:
      [
        'docs/development/progression.md',
        'https://github.com/mannie-exe/create-sky-compat/blob/main/docs/development/transmission-linkage.md',
      ]
  aeronautics_utility_objects:brass_universal_joint:
    text: Both joint rod types use these craftable heads. Andesite rods reach farther and hold near their linked rest length; brass rods permit shorter elastic connections. Use an actual shaft source and load. The legacy andesite head is hidden and is not a missing required recipe.
    status: source-reviewed
    sources:
      [
        'aeronautics_utility_objects:brass_universal_joint',
        'docs/development/progression.md',
      ]
  aeronautics_utility_objects:damping_stress_bearing:
    text: Recovers physical rotation through a separate rear kinetic output. Native assembly, controlled external rotation and Jade output inspection were checked. This is distinct from the zero-SU angular-rate sensor. No self-powered loop or practical production balance is established by the controlled fixture.
    status: runtime-checked
    sources:
      [
        'docs/development/progression.md',
        'https://github.com/mannie-exe/create-sky-compat/blob/main/docs/development/verification.md',
      ]
  travelersbackpack:standard:
    text: Equipped backpack contents follow YiGD's grave recovery rather than separate backpack placement. Native death, cold reload and an owner claim preserved the equipped backpack and named contents. Loose-item protections remain enabled.
    status: runtime-checked
    sources:
      - docs/development/compatibility.md#audio-and-death-recovery
      - overrides/common/config/travelersbackpack-server.toml
  yigd:grave:
    text: A generated death marker, not a normal inventory progression item. Right-click your own grave to recover stored inventory and vanilla dropped XP. Claiming removes the marker without dropping a grave item; Carry On excludes YiGD blocks.
    status: intentional-access-limit
    sources:
      - overrides/common/config/yigd.json
      - overrides/common/config/carryon-common.toml
  yigd:grave_key:
    text: Grave keys are disabled. Owner recovery requires no key or item fee; this registered utility is not a missing progression ingredient.
    status: optional-integration-disabled
    sources: ['overrides/common/config/yigd.json']
  yigd:death_scroll:
    text: Death scrolls are disabled. Recovery does not grant a teleport or remote inventory retrieval; this registered utility is not an enabled acquisition route.
    status: optional-integration-disabled
    sources: ['overrides/common/config/yigd.json']
  create_redstone_additions:verdigris:
    text: Native axe scraping yields 3–6 pieces after a successful copper weathering transition. Copper must first weather; opening a copper door or a canceled scrape is not a resource source. Verdigris feeds the upstream Cyan Quartz and semiconductor recipes; no recipe or yield rebalance was added.
    status: runtime-checked
    sources:
      [
        'docs/development/compatibility.md#redstone-control',
        'Create Sky Compat 0.14.0 native scraping fixture',
      ]
